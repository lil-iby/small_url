name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests et analyses
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests et couverture (avec PostgreSQL réel)
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://test:test@localhost:5432/test
        run: pytest

      - name: Analyse de sécurité du code (Bandit)
        run: bandit -q -r app

      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt

  docker:
    name: Image Docker et scan Trivy
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: url-shortener:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de l'image (Trivy), échec si vulnérabilité corrigeable
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: url-shortener:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan de la configuration (Dockerfile, compose, Terraform)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Test de bout en bout (docker compose)
        run: |
          docker compose up -d --build --wait
          curl --fail --silent localhost:8000/healthz
          curl --fail --silent localhost:8000/readyz
          code=$(curl --fail --silent -X POST localhost:8000/api/links \
            -H 'content-type: application/json' -H 'X-API-Key: cle-dev-locale' \
            -d '{"url":"https://example.com"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['code'])")
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/$code)" = "302"
          docker compose down -v

      - name: Connexion à GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image (branche main uniquement)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha

  infra:
    name: Validation Ansible et Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ansible-core ansible-lint
      - name: Ansible lint et syntaxe
        working-directory: infra/ansible
        run: |
          ansible-lint playbook.yml
          ansible-playbook --syntax-check -i inventory.example.ini playbook.yml
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt et validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
